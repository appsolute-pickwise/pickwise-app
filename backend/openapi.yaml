openapi: 3.0.3
info:
  title: PickWise API
  version: 1.1.0
  description: 제품 카탈로그 읽기 API. 가격은 수동 확인 시점의 값이다.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/me/password:
    put:
      summary: 현재 비밀번호 재확인 후 변경하고 모든 기기의 세션 폐기
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 8, maxLength: 128 }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: 변경 완료, 새 비밀번호로 다시 로그인 }
        '401': { description: 세션 만료 }
        '422': { description: 현재 비밀번호 불일치, 세션은 유지 }
        '429': { description: 요청 제한, Retry-After 응답 참고 }
  /api/v1/products:
    get:
      summary: 제품 목록 조회
      parameters:
        - name: category
          in: query
          schema: { type: string, maxLength: 80 }
        - name: query
          in: query
          description: 브랜드와 제품명에서 검색
          schema: { type: string, maxLength: 120 }
        - name: sort
          in: query
          schema: { type: string, enum: [name, priceAsc, priceDesc], default: name }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: 제품 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  page: { type: integer }
                  size: { type: integer }
                  total: { type: integer, format: int64 }
        '400': { description: 잘못된 검색 또는 페이지 값 }
  /api/v1/products/{id}:
    get:
      summary: 제품 상세 조회
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 제품 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { description: 제품이 존재하지 않음 }
  /api/v1/auth/register:
    post:
      summary: 회원가입과 로그인
      requestBody: { $ref: '#/components/requestBodies/Credentials' }
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '400': { description: 이메일 또는 8~128자 비밀번호 검증 실패 }
        '409': { description: 이미 가입한 이메일 }
  /api/v1/auth/login:
    post:
      summary: 로그인, 접근 토큰 15분 및 갱신 세션 30일 발급
      requestBody: { $ref: '#/components/requestBodies/Credentials' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { description: 인증 실패 }
  /api/v1/auth/refresh:
    post:
      summary: 접근·갱신 토큰 모두 회전, 최초 갱신 만료일은 연장하지 않음
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, maxLength: 150 }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { description: 만료·폐기·이미 사용한 갱신 토큰 }
  /api/v1/auth/me:
    get:
      summary: 현재 세션과 계정 확인
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 계정
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
        '401': { description: 접근 세션 만료 }
  /api/v1/auth/logout:
    post:
      summary: 현재 접근 세션과 해당 갱신 권한 삭제
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 로그아웃 완료 }
        '401': { description: 유효한 접근 세션 필요 }
  /api/v1/me/preferences:
    get:
      summary: 계정의 기본 취향 조회, 미저장 시 빈 객체
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 기본 취향
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences: { $ref: '#/components/schemas/Preferences' }
    put:
      summary: 기본 취향 저장
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200': { description: preferences 객체 반환 }
        '400': { description: 알 수 없는 항목·값 }
  /api/v1/me/comparisons:
    get:
      summary: 본인 비교 기록 최대 100개 조회
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 최근 수정 순
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comparison' }
    post:
      summary: 비교 저장, 서버 카탈로그 기준 스냅샷 생성
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/Comparison' }
      responses:
        '201': { description: id와 version 0 반환 }
        '400': { description: 중복·미등록·다른 카테고리 제품 또는 잘못된 취향 }
  /api/v1/me/comparisons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: 명시적 덮어쓰기, 스냅샷 새로 생성
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/Comparison' }
      responses:
        '200': { description: id와 증가한 version 반환 }
        '409': { description: 다른 요청이 먼저 수정함, 새로고침 필요 }
        '404': { description: 본인 소유 기록 없음 }
    delete:
      summary: 본인 비교 삭제
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 삭제 완료 }
        '404': { description: 본인 소유 기록 없음 }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  responses:
    Session:
      description: 토큰 원문은 응답에만 포함하며 DB에는 해시 저장
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Session' }
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, format: email, maxLength: 254 }
              password: { type: string, minLength: 8, maxLength: 128 }
    Comparison:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, productIds, preferences]
            properties:
              title: { type: string, minLength: 1, maxLength: 100 }
              productIds:
                type: array
                minItems: 1
                maxItems: 3
                uniqueItems: true
                items: { type: string }
              preferences: { $ref: '#/components/schemas/Preferences' }
              version: { type: integer, minimum: 0, default: 0 }
  schemas:
    Session:
      type: object
      required: [accessToken, refreshToken, expiresAt, refreshExpiresAt]
      properties:
        token: { type: string, description: accessToken 호환 별칭 }
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: string, format: date-time }
        refreshExpiresAt: { type: string, format: date-time }
    Preferences:
      type: object
      additionalProperties: false
      properties:
        priorities:
          type: array
          maxItems: 4
          items: { type: string, enum: [배터리, 무게, ANC, 방수] }
        budget: { type: string, nullable: true, enum: [5만원 미만, 5만~15만원, 15만원 초과, null] }
        wearType: { type: string, nullable: true, enum: [커널형, 세미오픈형, 오픈이어형, 귀걸이형, null] }
        requireAnc: { type: boolean, default: false }
        maxWeightGrams: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 100 }
        batteryCondition: { type: string, enum: [ancOn, normal], default: ancOn }
        weights:
          type: object
          additionalProperties: { type: integer, minimum: 1, maximum: 5 }
    Comparison:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        productIds:
          type: array
          items: { type: string }
        preferences: { $ref: '#/components/schemas/Preferences' }
        version: { type: integer }
        snapshot:
          type: object
          nullable: true
          description: null이면 저장 당시 정보 없음. 과거 값 추정 금지.
          properties:
            savedAt: { type: string, format: date-time }
            ruleVersion: { type: string, enum: [2026-11-fair-v1] }
            preferences: { $ref: '#/components/schemas/Preferences' }
            products:
              type: array
              items: { $ref: '#/components/schemas/Product' }
    Product:
      type: object
      required: [id, brand, name, category, tags, price, priceCheckedAt, priceComparisonSite, priceComparisonUrl, specs]
      properties:
        id: { type: string }
        brand: { type: string }
        name: { type: string }
        category: { type: string }
        imageAsset: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        price: { type: integer, minimum: 1 }
        priceCheckedAt: { type: string, format: date }
        priceComparisonSite: { type: string }
        priceComparisonUrl: { type: string, format: uri }
        specs:
          type: array
          items: { $ref: '#/components/schemas/Specification' }
    Specification:
      type: object
      required: [key, label, value]
      properties:
        key: { type: string }
        label: { type: string }
        value:
          oneOf:
            - { type: string }
            - { type: number }
            - { type: boolean }
        unit: { type: string, nullable: true }
        sourceUrl: { type: string, format: uri, nullable: true }
        checkedAt: { type: string, format: date, nullable: true }
