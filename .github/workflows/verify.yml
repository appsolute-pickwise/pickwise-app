name: Verify PickWise
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --no-pub
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: pickwise_test
          MYSQL_USER: pickwise
          MYSQL_PASSWORD: ci-only-password
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      PICKWISE_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: sh backend/mvnw -B -f backend/pom.xml test
